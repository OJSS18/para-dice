<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- No pinch-zoom or double-tap zoom on phones: the game handles its own scaling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- Let it be added to a phone's home screen and open full screen, like an app. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a0306">
    <title>Para-DICE</title>

    <!-- GitHub Pages can't send the "cross-origin isolation" headers the
         full version of love.js needs (for smooth audio). This small
         service worker adds them. On the very first visit it reloads the
         page once to switch itself on. -->
    <script src="coi-serviceworker.min.js"></script>

    <!-- Phones won't play sound until the player touches the page. Keep a
         list of every sound "context" the game makes, and wake them all up
         on the first tap, click or key press. -->
    <script>
      (function () {
        var contexts = [];
        ["AudioContext", "webkitAudioContext"].forEach(function (name) {
          var Original = window[name];
          if (!Original) return;
          window[name] = function () {
            var ctx = new (Function.prototype.bind.apply(Original, [null].concat([].slice.call(arguments))))();
            contexts.push(ctx);
            return ctx;
          };
          window[name].prototype = Original.prototype;
        });
        function wake() {
          contexts.forEach(function (ctx) { if (ctx.state === "suspended") ctx.resume(); });
        }
        ["touchstart", "touchend", "pointerdown", "mousedown", "keydown"].forEach(function (type) {
          window.addEventListener(type, wake, true);
        });
      })();
    </script>

    <link rel="stylesheet" type="text/css" href="theme/love.css">
  </head>
  <body>
    <div id="page">
      <h1>Para-DICE</h1>
      <div id="stage">
        <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="1366" height="768"></canvas>
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      </div>
      <footer>
        <button onclick="goFullScreen();">Go Fullscreen</button>
        &nbsp; Click or tap the game first so it can hear you. &nbsp;
        Made with <a href="https://love2d.org">LÖVE</a> and <a href="https://github.com/Davidobot/love.js">love.js</a>.
        If the screen stays blank, reload the page.
      </footer>
    </div>

    <!-- Shown on phones held upright: the game is built for landscape. -->
    <div id="rotate">
      <div class="phone"></div>
      <p>Turn your phone sideways to play</p>
    </div>

    <script type='text/javascript'>
      // Full screen the whole page (not just the canvas), and on phones that
      // allow it, lock the screen to landscape.
      function goFullScreen() {
        var el = document.documentElement;
        var request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (request) {
          var p = request.call(el);
          if (p && p.then && screen.orientation && screen.orientation.lock) {
            p.then(function () { screen.orientation.lock("landscape").catch(function () {}); });
          }
        }
      }

      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;
        loadingContext.fillStyle = "rgb(13, 77, 38)";
        loadingContext.fillRect(0, 0, canvas.width, canvas.height);
        loadingContext.font = 'bold 2em Georgia, serif';
        loadingContext.textAlign = 'center'
        loadingContext.fillStyle = "rgb(255, 210, 70)";
        loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
        loadingContext.font = '1.2em Georgia, serif';
        loadingContext.fillText("Shuffling the dice... (about 50 MB the first time)", canvas.width / 2, canvas.height / 4 * 3);
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      // Stop the page itself from scrolling when Space / arrow keys are pressed.
      window.addEventListener("keydown", function(e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, false);

      // Stop the page bouncing or scrolling when a finger drags on the game.
      document.addEventListener("touchmove", function (e) {
        if (e.target.tagName === "CANVAS") e.preventDefault();
      }, { passive: false });

      // THE GAME <-> PAGE BRIDGE. LÖVE in a browser can't fetch web pages or
      // use the clipboard itself, so the game prints a line starting with
      // "@@PD@@" and a JSON message (see net.lua). We do the job here and,
      // when there's an answer, write it as a file into the game's save
      // folder, where the game picks it up: first line = status, then text.
      var PD = {
        reply: function (path, status, text) {
          var slash = path.lastIndexOf("/");
          try { Module.FS_createPath("/", path.slice(1, slash), true, true); } catch (e) {}
          try { Module.FS_unlink(path); } catch (e) {}
          Module.FS_createDataFile(path.slice(0, slash), path.slice(slash + 1),
            status + "\n" + text, true, true);
        },
        handle: function (msg) {
          if (msg.kind === "http") {
            fetch(msg.url, { method: msg.method, headers: msg.headers || {}, body: msg.body || undefined })
              .then(function (r) { return r.text().then(function (t) { PD.reply(msg.reply, r.status, t); }); })
              .catch(function (e) { PD.reply(msg.reply, 0, String(e)); });
          } else if (msg.kind === "copy") {
            var fallback = function () { window.prompt("Copy your replay code:", msg.text); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(msg.text).catch(fallback);
            } else {
              fallback();
            }
          } else if (msg.kind === "paste") {
            PD.reply(msg.reply, 200, window.prompt(msg.prompt || "Paste here:", "") || "");
          }
        }
      };

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 268435456,
        print: function (text) {
          if (typeof text === "string" && text.indexOf("@@PD@@") === 0) {
            try { PD.handle(JSON.parse(text.slice(6))); } catch (e) { console.error(e); }
            return;
          }
          console.log(text);
        },
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.visibility = 'visible';
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      var applicationLoad = function(e) {
        Love(Module);
      }
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
  </body>
</html>
